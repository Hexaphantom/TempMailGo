# Render Blueprint for TempMailGo (optional — you can also configure manually).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tempmailgo
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # ALL of the following are OPTIONAL — the app runs with none set.
      # Optionally pin a DropMail af_ token to avoid any token-generation captcha
      # on IPs DropMail throttles (generate one at https://dropmail.me/api/).
      # If unset, the server auto-generates and reuses a 1h token.
      - key: DROPMAIL_TOKEN
        sync: false
    # Render provides PORT automatically; server.js already reads process.env.PORT.
